# 全国财税发票 SEO — Cloudflare Workers 一键部署配置
#
# 设计目标：GitHub → Cloudflare 单向部署
#   - CF 自动 provision D1 / R2 / KV（无需 database_id / namespace id）
#   - 部署结果与资源 ID 只存在于 Cloudflare 账号，不会写回 GitHub
#   - 本文件永远只保留 binding + 名称，禁止填入账号专属 ID
#   - 禁止把 CLOUDFLARE_API_TOKEN / JWT 写进仓库
#
# 线上地址形态：https://sonicjs.<账号子域>.workers.dev（子域由 CF 生成）

name = "sonicjs"
main = "src/entrypoint.ts"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# D1：仅 binding + 名称；ID 由 CF 绑定，不写回本文件
[[d1_databases]]
binding = "DB"
database_name = "sonicjs"
migrations_dir = "migrations"

# R2：仅 binding + bucket 名称
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sonicjs-media"

# KV：仅 binding；namespace id 由 CF 管理
[[kv_namespaces]]
binding = "CACHE_KV"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "全国财税发票服务"
SITE_URL = ""
BETTER_AUTH_URL = ""
CONTACT_PHONE = ""
CORS_ORIGINS = "*"
BUCKET_NAME = "sonicjs-media"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
