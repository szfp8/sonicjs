# Cloudflare Workers production configuration
# Domain, D1 and R2 are configured after deployment
# Project: szfp8-tax-seo

name = "szfp8-tax-seo"
main = "my-sonicjs-app/src/entrypoint.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Uncomment after creating D1
# [[d1_databases]]
# binding = "DB"
# database_name = "szfp8-tax-seo-db"
# database_id = "YOUR_D1_ID"
# migrations_dir = "my-sonicjs-app/migrations"

# Uncomment after creating R2
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "szfp8-tax-seo-media"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "全国财税发票服务"
SITE_URL = ""
BETTER_AUTH_URL = ""
CONTACT_PHONE = ""

# SEO/content scheduled tasks
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
