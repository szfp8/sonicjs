# 全国财税发票 SEO — Cloudflare Workers 一键部署配置
#
# 重要：
# 这里故意不填写 D1/KV/R2 的 resource ID。
# Cloudflare 的 Deploy to Cloudflare / Workers Builds 会根据这些 bindings
# 自动创建资源并在部署时注入实际 ID。不要再用脚本执行 d1 create / kv create / r2 create。
#
name = "sonicjs"
main = "src/entrypoint.ts"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# D1：只给默认名称，Deploy to Cloudflare 会自动创建并绑定。
[[d1_databases]]
binding = "DB"
database_name = "sonicjs"
migrations_dir = "migrations"

# R2：省略 bucket_name，让 Cloudflare 自动创建。
[[r2_buckets]]
binding = "MEDIA_BUCKET"

# KV：省略 id，让 Cloudflare 自动创建。
[[kv_namespaces]]
binding = "CACHE_KV"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "全国财税发票服务"
SITE_URL = ""
BETTER_AUTH_URL = ""
CONTACT_PHONE = ""
CORS_ORIGINS = "*"
BUCKET_NAME = ""

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
