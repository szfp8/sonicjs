# GitHub → Cloudflare Workers Builds
# 部署命令必须是：npm run deploy
# Root directory：留空
#
# 密钥说明（重要）：
#   JWT_SECRET / BETTER_AUTH_SECRET / INDEXNOW_KEY
#   → 只能在 Cloudflare 控制台添加为「Secret」
#   → 或由 npm run deploy 自动写入 Secret
#   → 禁止写进本文件，也禁止提交到 Git
#   → 控制台若提示「更新 Wrangler 配置」：对 Secret 忽略即可，不要把密钥贴进 toml

name = "sonicjs"
main = "src/entrypoint.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "sonicjs"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sonicjs-media"

[[kv_namespaces]]
binding = "CACHE_KV"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "全国财税发票服务"
SITE_URL = ""
BETTER_AUTH_URL = ""
CONTACT_PHONE = ""
CORS_ORIGINS = "*"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
