# GitHub → Cloudflare Workers Builds
# Worker name MUST match the connected Worker: sonicjs
# Root directory: repository root (empty)
# Custom Domain: leave empty (workers.dev)
# D1 / R2 / KV: auto-provisioned on deploy when IDs are omitted

name = "sonicjs"
main = "src/entrypoint.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "sonicjs"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sonicjs-media"

[[kv_namespaces]]
binding = "CACHE_KV"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "全国财税发票服务"
SITE_URL = ""
BETTER_AUTH_URL = ""
CONTACT_PHONE = ""

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
