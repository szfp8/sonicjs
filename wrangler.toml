# GitHub → Cloudflare Workers Builds
# 一键部署：Deploy command = npm run deploy；Root 留空

name = "sonicjs"
main = "src/entrypoint.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "sonicjs"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sonicjs-media"

[[kv_namespaces]]
binding = "CACHE_KV"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "全国财税发票服务"
SITE_URL = ""
BETTER_AUTH_URL = ""
CONTACT_PHONE = ""
# 允许本站前后端同源；部署后可在 CF 改成你的 workers.dev 完整地址
CORS_ORIGINS = "*"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
