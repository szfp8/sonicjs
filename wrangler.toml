# =============================================================================
# SonicJS 官方绑定（必须与 @sonicjs-cms/core 一致）
# 文档: https://sonicjs.com/blog/deploy-sonicjs-to-cloudflare-workers
#
# | 资源 | binding 名称（不可改） | 用途              |
# |------|------------------------|-------------------|
# | D1   | DB                     | 用户/内容/设置库  |
# | R2   | MEDIA_BUCKET           | 媒体上传          |
# | KV   | CACHE_KV               | 边缘缓存          |
#
# GitHub 一键部署：Deploy command = npm run deploy；Root 留空
# 密钥 JWT_SECRET / BETTER_AUTH_SECRET 仅用 CF Secret，禁止写进本文件
# =============================================================================

name = "sonicjs"
main = "src/entrypoint.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# ── D1（SonicJS 主库）────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "sonicjs"
migrations_dir = "migrations"

# ── R2（媒体库，绑定名必须为 MEDIA_BUCKET）───────────────────────────────────
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sonicjs-media"

# ── KV（缓存，绑定名必须为 CACHE_KV）─────────────────────────────────────────
[[kv_namespaces]]
binding = "CACHE_KV"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "全国财税发票服务"
SITE_URL = ""
BETTER_AUTH_URL = ""
CONTACT_PHONE = ""
CORS_ORIGINS = "*"
# SonicJS 媒体 URL 会读 BUCKET_NAME，需与上面 R2 bucket_name 一致
BUCKET_NAME = "sonicjs-media"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
