name: Deploy SonicJS to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      SITE_URL: ${{ secrets.SITE_URL }}
      SITE_NAME: ${{ secrets.SITE_NAME }}
      CONTACT_PHONE: ${{ secrets.CONTACT_PHONE }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build:core

      - name: Generate production Wrangler config
        working-directory: my-sonicjs-app
        shell: bash
        run: |
          test -n "$D1_DATABASE_ID"
          test -n "$D1_DATABASE_NAME"
          test -n "$SITE_URL"
          DOMAIN="${SITE_URL#https://}"
          DOMAIN="${DOMAIN#http://}"
          DOMAIN="${DOMAIN%/}"
          cat > wrangler.production.toml <<EOF
          name = "szfp8-tax-seo"
          main = "src/index.ts"
          compatibility_date = "2026-09-01"
          compatibility_flags = ["nodejs_compat"]
          workers_dev = true

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_DATABASE_NAME"
          database_id = "$D1_DATABASE_ID"
          migrations_dir = "./migrations"

          [vars]
          ENVIRONMENT = "production"
          SITE_NAME = "${SITE_NAME:-National Tax & Invoice Service}"
          SITE_URL = "$SITE_URL"
          CONTACT_PHONE = "${CONTACT_PHONE:-}"

          [[routes]]
          pattern = "$DOMAIN"
          custom_domain = true

          [triggers]
          crons = ["0 */6 * * *"]

          [observability]
          enabled = true
          EOF

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config my-sonicjs-app/wrangler.production.toml

      - name: Set IndexNow secret
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: printf '%s' "$INDEXNOW_KEY" | npx wrangler secret put INDEXNOW_KEY --config my-sonicjs-app/wrangler.production.toml

      - name: Deploy Worker
        run: npx wrangler deploy --config my-sonicjs-app/wrangler.production.toml
