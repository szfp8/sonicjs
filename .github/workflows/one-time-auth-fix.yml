name: One-time auth loop repair

on:
  push:
    paths:
      - '.github/auth-fix.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run auth repair script
        run: python .github/scripts/auth_loop_fix.py

      - name: Verify repair
        run: |
          grep -n "const browserUser = await c.env.DB.prepare" packages/core/src/routes/auth.ts
          grep -n "const currentUser = await c.env.DB.prepare" packages/core/src/app.ts

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/routes/auth.ts packages/core/src/app.ts
          if git diff --cached --quiet; then
            echo "No auth repair changes are needed."
            exit 0
          fi
          git commit -m "fix: repair browser auth session loop [auth-loop-fix]"
          git push
