# Safe local/default configuration. Production deployment uses scripts/cloudflare/setup.mjs
# to generate wrangler.production.toml with the user's own D1 ID and domain.
name = "szfp8-tax-seo"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_WITH_YOUR_D1_DATABASE_NAME"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "./migrations"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "全国财税发票服务"
SITE_URL = "https://example.com"
CONTACT_PHONE = ""
# Set INDEXNOW_KEY as a Wrangler secret for production; do not commit it here.

[triggers]
# UTC: four times per day. Used only for optional IndexNow notifications and maintenance.
crons = ["0 */6 * * *"]

[observability]
enabled = true
