# Production Cloudflare Workers configuration.
# Cloudflare Workers Builds can deploy this directory directly.
# Deploy does not execute D1 migrations automatically.
name = "szfp8-tax-seo"
main = "src/entrypoint.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "szfp8-tax-seo-db"
database_id = "ef7afcee-e86e-4c42-8ea5-d893fa8394ce"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "szfp8-tax-seo-media"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "全国财税发票服务"
SITE_URL = "https://szfp8.com"
BETTER_AUTH_URL = "https://szfp8.com"
CONTACT_PHONE = ""

[triggers]
crons = ["0 */6 * * *"]

[observability]
enabled = true
