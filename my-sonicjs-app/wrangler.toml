# Cloudflare Deploy to Cloudflare template configuration.
# D1 and R2 are intentionally declared without account-specific IDs/namespaces.
# Cloudflare provisions and binds them during one-click deployment.
name = "szfp8-tax-seo"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "szfp8-tax-seo-db"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "szfp8-tax-seo-media"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "全国财税发票服务"
SITE_URL = "https://szfp8.com"
CONTACT_PHONE = ""
# INDEXNOW_KEY is optional. Do not commit secrets here.

[triggers]
# UTC: four times per day. IndexNow notifications are sent only when INDEXNOW_KEY is configured.
crons = ["0 */6 * * *"]

[observability]
enabled = true
