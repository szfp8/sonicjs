# GitHub → Cloudflare Workers Builds 直连部署
# Root directory = my-sonicjs-app
# 域名 / Custom Domain：不配置（留空）
# D1 / R2：在 Cloudflare 控制台 Bindings 中添加（变量名 DB / MEDIA_BUCKET）

name = "szfp8-tax-seo"
main = "src/entrypoint.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 不在仓库写死 database_id，避免全新 CF 账号部署失败。
# 请在 Cloudflare 控制台 → 本 Worker → Settings → Bindings 添加：
#   D1  → binding 名称: DB
#   R2  → binding 名称: MEDIA_BUCKET

[vars]
ENVIRONMENT = "production"
SITE_NAME = "全国财税发票服务"
SITE_URL = ""
BETTER_AUTH_URL = ""
CONTACT_PHONE = ""

[triggers]
crons = ["0 */6 * * *"]

[observability]
enabled = true
